<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 59- Smart Login UI</title>
</head>

<body>
    <button class="theme-toggle" aria-label="Toggle theme"></button>
    <div class="card">
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to continue</p>
        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required>
                <span class="error" id="emailError"></span>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" autocomplete="current-password" placeholder="********"
                        required>
                    <button type="button" class="toggle-password" aria-label="toggle-password visibility"></button>
                    <div class="strength-meter">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                </div>
                <span class="strength-text" id="strengthText"></span>
                <span class="error" id="passwordError"></span>
            </div>
            <button type="submit" id="submitBtn" disabled>Sign In</button>
        </form>
        <div id="successMessage" class="success-message" style="display:none">Successfully signed in! (demo)</div>
        <button type="button" class="logout-btn" id="logoutBtn" style="display: none">Logout</button>
    </div>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</body>

</html>
